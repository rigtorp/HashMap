name: C/C++ CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            compiler: g++
            flags: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          - name: Linux Clang
            os: ubuntu-latest
            compiler: clang++
            flags: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          - name: macOS Clang
            os: macos-latest
            compiler: clang++
            flags: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          - name: Windows MSVC
            os: windows-latest
            compiler: cl
            flags: ''
    env:
      CXX: ${{ matrix.compiler }}
      HASHMAP_CXX_FLAGS: ${{ matrix.flags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: |
          cmake_args=()
          if [[ "$RUNNER_OS" != Windows ]]; then
            cmake_args+=("-DCMAKE_BUILD_TYPE=Debug")
          fi
          if [[ -n "$HASHMAP_CXX_FLAGS" ]]; then
            cmake_args+=("-DCMAKE_CXX_FLAGS=$HASHMAP_CXX_FLAGS")
          fi
          cmake -S . -B build \
            -DCMAKE_CXX_STANDARD=14 \
            -DHASHMAP_WARNINGS_AS_ERRORS=ON \
            "${cmake_args[@]}"
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Check CMake consumers and package relocation
        run: >-
          cmake -DHASHMAP_SOURCE_DIR="$GITHUB_WORKSPACE"
          -DHASHMAP_CHECK_DIR="$RUNNER_TEMP/hashmap-package-check"
          -P tests/cmake/check.cmake
